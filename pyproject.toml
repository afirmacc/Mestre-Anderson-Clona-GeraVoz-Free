[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-skill-clonagem-voz"
version = "0.1.0rc2"
description = "Diagnóstico e operação auditável de clonagem local autorizada de voz."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Anderson Oliveira" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
]

[project.scripts]
voice-clone = "voice_clone.cli:main"

[tool.setuptools]
packages = ["voice_clone"]

[tool.setuptools.data-files]
"share/ia-skill-clonagem-voz" = ["SKILL.md", "installers/install-macos.sh"]
"share/ia-skill-clonagem-voz/schemas" = ["schemas/profile.schema.json", "schemas/manifest.schema.json"]
"share/ia-skill-clonagem-voz/templates" = ["templates/consentimento.txt", "templates/voice-test-cases.json"]

[project.optional-dependencies]
mlx = [
  "mlx==0.32.0",
  "mlx-audio==0.4.7",
  "numpy>=1.26,<3",
  "mlx-whisper>=0.4,<1",
]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
