[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-skill-clonagem-voz"
version = "0.1.0.dev0"
description = "Diagnóstico e operação auditável de clonagem local autorizada de voz."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Anderson Oliveira" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
]

[project.scripts]
voice-clone = "voice_clone.cli:main"

[tool.setuptools]
packages = ["voice_clone"]

[tool.pytest.ini_options]
testpaths = ["tests"]

