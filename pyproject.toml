[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ia-skill-clonagem-voz"
version = "0.3.2"
description = "Clonagem local e autorizada de voz para agentes de IA: captação guiada, pronúncia certa (dicionários, escuta e aprendizado), fidelidade de tom, narração de roteiros. Por Mestre Anderson Menezes de Oliveira · afirma.cc"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mestre Anderson Menezes de Oliveira", email = "app@afirma.cc" }]
maintainers = [{ name = "Afirma", email = "app@afirma.cc" }]
keywords = ["voice-cloning", "tts", "qwen3-tts", "mlx", "agent-skill", "claude", "codex", "hermes", "narration", "clonagem-de-voz"]
dependencies = ["numpy>=1.26,<3"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Natural Language :: Portuguese (Brazilian)",
  "Natural Language :: English",
  "Natural Language :: Spanish",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/afirmacc/ia-skill-clonagem-voz"
Afirma = "https://afirma.cc"
Issues = "https://github.com/afirmacc/ia-skill-clonagem-voz/issues"

[project.scripts]
voice-clone = "voice_clone.cli:main"

[tool.setuptools]
packages = ["voice_clone"]

[tool.setuptools.package-data]
voice_clone = ["dicionarios/*.json"]

[tool.setuptools.data-files]
"share/ia-skill-clonagem-voz" = ["SKILL.md", "installers/install-macos.sh"]
"share/ia-skill-clonagem-voz/schemas" = ["schemas/profile.schema.json", "schemas/manifest.schema.json"]
"share/ia-skill-clonagem-voz/templates" = ["templates/consentimento.txt", "templates/consent.en.txt", "templates/consentimiento.es.txt", "templates/voice-test-cases.json", "templates/pronunciation.example.json", "templates/roteiro-exemplo.txt", "templates/roteiro-exemplo.json"]

[project.optional-dependencies]
mlx = [
  "mlx==0.32.0",
  "mlx-audio==0.4.7",
  "numpy>=1.26,<3",
  "mlx-whisper>=0.4,<1",
]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
