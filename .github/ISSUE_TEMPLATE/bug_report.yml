name: Relatar problema
description: Informe uma falha reproduzível sem anexar voz ou dado privado.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Não anexe voz real, consentimento, credencial ou perfil privado."
  - type: input
    id: version
    attributes:
      label: Versão ou commit
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Plataforma e hardware
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Resultado observado
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: Removi vozes, dados pessoais e segredos do relato.
          required: true

