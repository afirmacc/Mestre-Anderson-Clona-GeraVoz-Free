name: Propor melhoria
description: Sugira funcionalidade, backend, teste ou melhoria de documentação.
title: "[Ideia]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema ou necessidade
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Impactos de segurança e privacidade
    validations:
      required: true

