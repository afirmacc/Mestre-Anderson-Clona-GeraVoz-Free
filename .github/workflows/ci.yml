name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  wheel:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Confere recursos do wheel
        run: python -c 'from pathlib import Path; from zipfile import ZipFile; w=next(Path("dist").glob("*.whl")); n=ZipFile(w).namelist(); required=("install-macos.sh","SKILL.md","profile.schema.json","manifest.schema.json","consentimento.txt","consent.en.txt","consentimiento.es.txt","pronunciation.example.json","voice-test-cases.json","dicionarios/pt.json","dicionarios/en.json","dicionarios/es.json"); missing=[x for x in required if not any(y.endswith(x) for y in n)]; assert not missing, missing'
